name: Atlas deterministic qualification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.2"
      - name: Bootstrap dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for repository capture
        run: base64 -w0 package-lock.json
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualification
        run: npm run qualify
      - name: Build
        run: npm run build
